name: ${DCP_COMPOSE_PROJECT:-directcard-protocol}

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    image: directcard-protocol:${DCP_RELEASE:?set DCP_RELEASE}
    ports:
      - "127.0.0.1:18120:8080"
    environment:
      DCP_DATA_DIR: /data
      DCP_CONFIG_DIR: /config
      DCP_ENABLE_PROMO: "false"
      DCP_USE_FAKE: "false"
      DCP_AUTH_FILE: /run/dcp-auth.json
      DCP_PUBLIC_ORIGIN: ${DCP_PUBLIC_ORIGIN:-}
    volumes:
      - data:/data
      - ${DCP_PRIVATE_DIR:?set DCP_PRIVATE_DIR}/proxy-config:/config:rw
      - ${DCP_PRIVATE_DIR:?set DCP_PRIVATE_DIR}/container-auth.json:/run/dcp-auth.json:ro
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 1024m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/login', timeout=3); assert r.status == 200"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  data:
