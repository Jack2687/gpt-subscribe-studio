name: ${GSS_COMPOSE_PROJECT:-gpt-subscribe-studio}

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    image: gpt-subscribe-studio:${GSS_RELEASE:?set GSS_RELEASE}
    ports:
      - "127.0.0.1:18120:8080"
    environment:
      GSS_DATA_DIR: /data
      GSS_CONFIG_DIR: /config
      GSS_ENABLE_PROMO: "false"
      GSS_USE_FAKE: "false"
      GSS_AUTH_FILE: /run/gss-auth.json
      GSS_PUBLIC_ORIGIN: ${GSS_PUBLIC_ORIGIN:-}
    volumes:
      - data:/data
      - ${GSS_PRIVATE_DIR:?set GSS_PRIVATE_DIR}/proxy-config:/config:rw
      - ${GSS_PRIVATE_DIR:?set GSS_PRIVATE_DIR}/container-auth.json:/run/gss-auth.json:ro
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 1024m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/login', timeout=3); assert r.status == 200"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  data:
